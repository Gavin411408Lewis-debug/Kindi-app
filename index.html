<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<title>KINDI STOCK - إدارة مواد التعبئة</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
    :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --card-border: #2c2c2c;
        --text-color: #e0e0e0;
        --text-secondary: #a0a0a0;
        --accent-color: #bb86fc;
        --danger-color: #cf6679;
        --success-color: #03dac6;
        --input-bg: #2c2c2c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        padding: 12px;
        max-width: 500px;
        margin: 0 auto;
        padding-bottom: 40px;
    }

    header {
        text-align: center;
        margin-bottom: 16px;
        padding: 10px;
    }

    header h1 {
        color: var(--accent-color);
        font-size: 1.3rem;
        font-weight: 800;
    }

    header p {
        color: var(--text-secondary);
        font-size: 0.8rem;
        margin-top: 2px;
    }

    .top-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
    }

    button {
        background-color: var(--accent-color);
        color: #121212;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: bold;
        font-size: 0.9rem;
        cursor: pointer;
    }

    button:active { opacity: 0.8; }

    .btn-secondary {
        background-color: var(--input-bg);
        color: var(--text-color);
        border: 1px solid var(--card-border);
    }

    .search-box {
        margin-bottom: 12px;
    }

    input, select {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--card-border);
        background-color: var(--input-bg);
        color: var(--text-color);
        font-size: 0.95rem;
        outline: none;
    }

    input:focus { border-color: var(--accent-color); }

    /* نظام البطاقات العمودية المرتبة للآيفون */
    .cards-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .card {
        background-color: var(--card-bg);
        border-radius: 12px;
        padding: 14px;
        border: 1px solid var(--card-border);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .card.alert-card {
        border-color: var(--danger-color);
        background-color: rgba(207, 102, 121, 0.04);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid var(--card-border);
        padding-bottom: 8px;
    }

    .item-name {
        font-weight: bold;
        font-size: 1rem;
        color: var(--accent-color);
    }

    .item-code {
        font-size: 0.75rem;
        color: var(--text-secondary);
        background: #252525;
        padding: 2px 6px;
        border-radius: 4px;
    }

    .card-details {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--text-secondary);
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        background: #252525;
        padding: 6px 10px;
        border-radius: 6px;
    }

    .detail-row span strong {
        color: var(--text-color);
    }

    .diff-status {
        font-size: 0.8rem;
        padding: 4px 8px;
        border-radius: 6px;
        text-align: center;
        font-weight: bold;
    }

    .status-ok { background: rgba(3, 218, 198, 0.1); color: var(--success-color); }
    .status-danger { background: rgba(207, 102, 121, 0.15); color: var(--danger-color); }

    .card-actions {
        display: flex;
        gap: 6px;
        margin-top: 4px;
    }

    .card-actions button {
        flex: 1;
        padding: 8px;
        font-size: 0.75rem;
        border-radius: 6px;
    }

    .btn-del {
        background-color: transparent;
        color: var(--danger-color);
        border: 1px solid var(--danger-color);
    }

    .empty-msg {
        text-align: center;
        color: var(--text-secondary);
        padding: 30px;
        font-size: 0.9rem;
    }

    /* Modal نافذة الإضافة */
    .modal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-box {
        background: var(--card-bg);
        width: 100%;
        max-width: 500px;
        max-height: 85vh;
        overflow: auto;
        border-radius: 20px 20px 0 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.75rem; color: var(--text-secondary); }
</style>
</head>
<body>

<header>
    <h1>KINDI STOCK</h1>
    <p>إدارة المواد والتغليف - شركة الكندي</p>
</header>

<div class="top-actions">
    <button onclick="openAddModal()">➕ إضافة مادة</button>
    <button class="btn-secondary" onclick="document.getElementById('excelInput').click()">📥 استيراد إكسل</button>
    <input type="file" id="excelInput" style="display:none" accept=".xlsx, .xls" onchange="importExcel(event)">
    <button class="btn-secondary" onclick="exportExcel()">📤 تصدير إكسل</button>
    <button class="btn-secondary" onclick="clearAll()">🗑️ مسح الكل</button>
</div>

<div class="search-box">
    <input type="search" id="searchInput" placeholder="🔎 ابحث بالرمز أو اسم المادة أو المستحضر..." oninput="renderItems()">
</div>

<div class="cards-container" id="cardsContainer">
    <!-- البطاقات تظهر هنا عمودياً -->
</div>

<!-- Modal الإضافة والتعديل -->
<div class="modal" id="itemModal">
    <div class="modal-box">
        <h3 id="modalTitle" style="color:var(--accent-color); font-size:1.1rem;">إضافة مادة جديدة</h3>
        
        <div class="field-group">
            <label>رمز المادة (Code)</label>
            <input type="text" id="mCode" placeholder="أدخل الرمز">
        </div>
        <div class="field-group">
            <label>اسم المادة</label>
            <input type="text" id="mName" placeholder="اسم المادة">
        </div>
        <div class="field-group">
            <label>اسم المستحضر</label>
            <input type="text" id="mProduct" placeholder="المستحضر">
        </div>
        <div class="field-group">
            <label>الكمية الدفترية</label>
            <input type="number" id="mBook" placeholder="0">
        </div>
        <div class="field-group">
            <label>الكمية الفعلية (المجردة)</label>
            <input type="number" id="mActual" placeholder="0">
        </div>
        <div class="field-group">
            <label>الوحدة</label>
            <select id="mUnit">
                <option value="PCS">PCS</option>
                <option value="KG">KG</option>
            </select>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button class="btn-secondary" style="flex:1;" onclick="closeModal()">إلغاء</button>
            <button style="flex:1;" onclick="saveItem()">حفظ</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = "KINDI_MATERIALS_V4";
    let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let editIndex = -1;

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function renderItems() {
        const container = document.getElementById('cardsContainer');
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        
        container.innerHTML = '';

        const filtered = items.filter(item => 
            (item.code && item.code.toLowerCase().includes(query)) ||
            (item.name && item.name.toLowerCase().includes(query)) ||
            (item.product && item.product.toLowerCase().includes(query))
        );

        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-msg">لا توجد مواد مطابقة</div>';
            return;
        }

        filtered.forEach((item, originalIndex) => {
            const index = items.indexOf(item);
            const book = parseFloat(item.book) || 0;
            const actual = parseFloat(item.actual) || 0;
            const diff = Math.abs(book - actual);
            const isAlert = diff > 3000;

            const card = document.createElement('div');
            card.className = `card ${isAlert ? 'alert-card' : ''}`;

            card.innerHTML = `
                <div class="card-header">
                    <div>
                        <div class="item-name">${item.name || 'بدون اسم'}</div>
                        <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:2px;">المستحضر: ${item.product || '-'}</div>
                    </div>
                    <span class="item-code">${item.code || 'بدون رمز'}</span>
                </div>

                <div class="card-details">
                    <div class="detail-row">
                        <span>الدفترية: <strong>${book} ${item.unit || 'PCS'}</strong></span>
                        <span>الفعلية: <strong>${actual} ${item.unit || 'PCS'}</strong></span>
                    </div>
                    <div class="detail-row">
                        <span>الفرق: <strong>${diff}</strong></span>
                        <span>الوحدة: <strong>${item.unit || 'PCS'}</strong></span>
                    </div>
                    <div class="diff-status ${isAlert ? 'status-danger' : 'status-ok'}">
                        ${isAlert ? '⚠️ تجاوز حد الفرق (أعلى من 3,000)' : '✓ الفرق ضمن الحد المسموح'}
                    </div>
                </div>

                <div class="card-actions">
                    <button class="btn-secondary" onclick="openEditModal(${index})">تعديل</button>
                    <button class="btn-del" onclick="deleteItem(${index})">حذف</button>
                </div>
            `;

            container.appendChild(card);
        });
    }

    function openAddModal() {
        editIndex = -1;
        document.getElementById('modalTitle').textContent = "إضافة مادة جديدة";
        document.getElementById('mCode').value = '';
        document.getElementById('mName').value = '';
        document.getElementById('mProduct').value = '';
        document.getElementById('mBook').value = '';
        document.getElementById('mActual').value = '';
        document.getElementById('mUnit').value = 'PCS';
        document.getElementById('itemModal').classList.add('show');
    }

    function openEditModal(index) {
        editIndex = index;
        const item = items[index];
        document.getElementById('modalTitle').textContent = "تعديل بيانات المادة";
        document.getElementById('mCode').value = item.code || '';
        document.getElementById('mName').value = item.name || '';
        document.getElementById('mProduct').value = item.product || '';
        document.getElementById('mBook').value = item.book || 0;
        document.getElementById('mActual').value = item.actual || 0;
        document.getElementById('mUnit').value = item.unit || 'PCS';
        document.getElementById('itemModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('itemModal').classList.remove('show');
    }

    function saveItem() {
        const code = document.getElementById('mCode').value.trim();
        const name = document.getElementById('mName').value.trim();
        const product = document.getElementById('mProduct').value.trim();
        const book = parseFloat(document.getElementById('mBook').value) || 0;
        const actual = parseFloat(document.getElementById('mActual').value) || 0;
        const unit = document.getElementById('mUnit').value;

        if (!name && !code) {
            alert('يرجى إدخال اسم المادة أو الرمز على الأقل');
            return;
        }

        const newItem = { code, name, product, book, actual, unit };

        if (editIndex === -1) {
            items.unshift(newItem);
        } else {
            items[editIndex] = newItem;
        }

        saveData();
        closeModal();
        renderItems();
    }

    function deleteItem(index) {
        if (confirm('هل أنت متأكد من حذف هذه المادة؟')) {
            items.splice(index, 1);
            saveData();
            renderItems();
        }
    }

    function clearAll() {
        if (confirm('تحذير: سيتم حذف جميع البيانات المخزنة نهائياً!')) {
            items = [];
            saveData();
            renderItems();
        }
    }

    function importExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

                let count = 0;
                rows.forEach(row => {
                    // مطابقة مرنة لأسماء الأعمدة القادمة من الإكسل
                    const code = String(row.Code || row.رمز || row.الكود || "").trim();
                    const name = String(row.Name || row.المادة || row.اسم_المادة || "").trim();
                    const product = String(row.Product || row.المستحضر || "").trim();
                    const book = parseFloat(row.Book || row.الدفترية || row.الرصيد || 0) || 0;
                    const actual = parseFloat(row.Actual || row.الفعلية || 0) || 0;
                    const unit = String(row.Unit || row.الوحدة || "PCS").trim().toUpperCase();

                    if (name || code) {
                        items.push({ code, name, product, book, actual, unit: unit.includes('KG') ? 'KG' : 'PCS' });
                        count++;
                    }
                });

                saveData();
                renderItems();
                alert(`تم استيراد ${count} مادة بنجاح!`);
            } catch (err) {
                alert('حدث خطأ أثناء قراءة ملف الإكسل.');
            }
        };
        reader.readAsArrayBuffer(file);
        event.target.value = '';
    }

    function exportExcel() {
        if (items.length === 0) {
            alert('لا توجد بيانات للتصدير');
            return;
        }
        const wsData = items.map(i => ({
            "الرمز": i.code,
            "اسم المادة": i.name,
            "المستحضر": i.product,
            "الكمية الدفترية": i.book,
            "الكمية الفعلية": i.actual,
            "الوحدة": i.unit,
            "الفرق": Math.abs(i.book - i.actual)
        }));

        const ws = XLSX.utils.json_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Materials");
        XLSX.writeFile(wb, "Kindi_Stock_Report.xlsx");
    }

    renderItems();
</script>

</body>
</html>
