<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة مواد التعبئة والتغليف - شركة الكندي</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #bb86fc;
            --accent-hover: #3700b3;
            --danger-color: #cf6679;
            --border-color: #2c2c2c;
            --input-bg: #2d2d2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            direction: rtl;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.25rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Card Layout */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: #fff;
            margin-top: 4px;
            padding: 8px;
            font-size: 0.85rem;
        }

        /* Alert Styling */
        .alert {
            background-color: rgba(207, 102, 121, 0.15);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: none;
        }

        /* Items List Cards */
        .item-card {
            background-color: var(--input-bg);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-right: 4px solid var(--accent-color);
        }

        .item-info {
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .diff-alert {
            border-right-color: var(--danger-color) !important;
            background-color: rgba(207, 102, 121, 0.08);
        }
    </style>
</head>
<body>

    <header>
        <h1>شركة الكندي للصناعات الدوائية</h1>
        <p style="font-size: 0.8rem; color: var(--text-secondary);">إدارة مواد التعبئة والتغليف (الاثزو)</p>
    </header>

    <div class="container">
        
        <!-- بطاقة إضافة مادة جديدة -->
        <div class="card">
            <div class="card-title">إضافة مادة جديدة للبرنامج</div>
            <div id="formAlert" class="alert">تحذير: الفروقات تجاوزت الحد المسموح (3,000 دينار)!</div>
            
            <div class="form-group">
                <label for="itemName">اسم المادة</label>
                <input type="text" id="itemName" placeholder="أدخل اسم المادة...">
            </div>

            <div class="form-group">
                <label for="itemCode">رمز المادة</label>
                <input type="text" id="itemCode" placeholder="أدخل الرمز...">
            </div>

            <div class="form-group">
                <label for="itemQty">الكمية</label>
                <input type="number" id="itemQty" placeholder="0">
            </div>

            <div class="form-group">
                <label for="itemDiff">الفروقات (د.ع)</label>
                <input type="number" id="itemDiff" placeholder="0" oninput="checkDifference()">
            </div>

            <button onclick="addNewItem()">إضافة المادة</button>
        </div>

        <!-- بطاقة عرض المواد المضافة -->
        <div class="card">
            <div class="card-title">قائمة المواد المضافة</div>
            <div id="itemsContainer">
                <p style="text-align: center; color: var(--text-secondary); font-size: 0.85rem;" id="emptyMsg">لا توجد مواد مضافة حالياً. استخدم النموذج أعلاه لإضافة المواد.</p>
            </div>
        </div>

    </div>

    <script>
        // مصفوفة تخزين المواد المضافة ديناميكياً
        let dynamicItems = [];

        function checkDifference() {
            const diffVal = parseFloat(document.getElementById('itemDiff').value) || 0;
            const alertBox = document.getElementById('formAlert');
            
            // قاعدة الفروقات: إذا تجاوزت 3,000 دينار يظهر تنبيه أحمر
            if (Math.abs(diffVal) > 3000) {
                alertBox.style.display = 'block';
            } else {
                alertBox.style.display = 'none';
            }
        }

        function addNewItem() {
            const name = document.getElementById('itemName').value.trim();
            const code = document.getElementById('itemCode').value.trim();
            const qty = document.getElementById('itemQty').value;
            const diff = document.getElementById('itemDiff').value;

            if (!name) {
                alert('يرجى إدخال اسم المادة على الأقل.');
                return;
            }

            const newItem = {
                id: Date.now(),
                name: name,
                code: code || 'غير محدد',
                qty: qty || '0',
                diff: diff || '0'
            };

            dynamicItems.push(newItem);
            renderItems();
            clearForm();
        }

        function deleteItem(id) {
            dynamicItems = dynamicItems.filter(item => item.id !== id);
            renderItems();
        }

        function renderItems() {
            const container = document.getElementById('itemsContainer');
            
            if (dynamicItems.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-secondary); font-size: 0.85rem;" id="emptyMsg">لا توجد مواد مضافة حالياً. استخدم النموذج أعلاه لإضافة المواد.</p>`;
                return;
            }

            let html = '';
            dynamicItems.forEach(item => {
                const isOverLimit = Math.abs(parseFloat(item.diff) || 0) > 3000;
                html += `
                    <div class="item-card ${isOverLimit ? 'diff-alert' : ''}">
                        <div class="item-info">
                            <strong>${item.name}</strong>
                            <span>الرمز: ${item.code}</span>
                        </div>
                        <div class="item-info">
                            <span>الكمية: ${item.qty}</span>
                            <span>الفروقات: ${item.diff} د.ع</span>
                        </div>
                        <button class="btn-danger" onclick="deleteItem(${item.id})">حذف المادة</button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function clearForm() {
            document.getElementById('itemName').value = '';
            document.getElementById('itemCode').value = '';
            document.getElementById('itemQty').value = '';
            document.getElementById('itemDiff').value = '';
            document.getElementById('formAlert').style.display = 'none';
        }
    </script>
</body>
</html>
