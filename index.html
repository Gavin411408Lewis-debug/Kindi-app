<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة مواد التعبئة والتغليف</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #bb86fc;
            --border-color: #2c2c2c;
            --danger-color: #cf6679;
            --success-color: #03dac6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent-color);
            font-size: 1.4rem;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #2c2c2c;
            color: var(--text-color);
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
        }

        button:active {
            opacity: 0.8;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card.alert {
            border-color: var(--danger-color);
            background-color: rgba(207, 102, 121, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .card-body span strong {
            color: var(--text-color);
        }

        .diff-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            width: fit-content;
        }

        .diff-ok {
            background-color: rgba(3, 218, 198, 0.15);
            color: var(--success-color);
        }

        .diff-alert {
            background-color: rgba(207, 102, 121, 0.15);
            color: var(--danger-color);
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 6px;
            font-size: 0.8rem;
            margin-top: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h2>إدارة مواد التعبئة والتغليف</h2>

    <div class="form-container">
        <div class="field-group">
            <label>اسم المادة / المستحضر</label>
            <input type="text" id="itemName" placeholder="أدخل اسم المادة">
        </div>

        <div class="field-group">
            <label>الكمية الدفترية (المخططة)</label>
            <input type="number" id="bookQty" placeholder="0">
        </div>

        <div class="field-group">
            <label>الكمية الفعلية (المجردة)</label>
            <input type="number" id="actualQty" placeholder="0">
        </div>

        <button onclick="addItem()">إضافة وحساب الفرق</button>
    </div>

    <div class="cards-container" id="cardsContainer">
        <!-- تظهر البطاقات هنا -->
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('kindi_items')) || [];

        function renderItems() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">لا توجد مواد مضافة حالياً</p>';
                return;
            }

            items.forEach((item, index) => {
                const diff = Math.abs(item.bookQty - item.actualQty);
                const isAlert = diff > 3000;

                const card = document.createElement('div');
                card.className = `card ${isAlert ? 'alert' : ''}`;

                card.innerHTML = `
                    <div class="card-header">
                        <span>${item.name}</span>
                        <span style="font-size: 0.85rem; color: var(--text-secondary);">${item.date}</span>
                    </div>
                    <div class="card-body">
                        <span>الدفترية: <strong>${item.bookQty}</strong></span>
                        <span>الفعلية: <strong>${item.actualQty}</strong></span>
                        <span>الفرق: <strong>${diff}</strong></span>
                        <div>
                            <span class="diff-tag ${isAlert ? 'diff-alert' : 'diff-ok'}">
                                ${isAlert ? 'تجاوز الحد (أعلى من 3000)' : 'ضمن الحد المسموح'}
                            </span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteItem(${index})">حذف السجل</button>
                `;

                container.appendChild(card);
            });
        }

        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const bookQty = parseFloat(document.getElementById('bookQty').value);
            const actualQty = parseFloat(document.getElementById('actualQty').value);

            if (!name || isNaN(bookQty) || isNaN(actualQty)) {
                alert('يرجى ملء جميع الحقول بشكل صحيح');
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('ar-IQ') + ' ' + now.toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });

            const newItem = {
                name,
                bookQty,
                actualQty,
                date: dateStr
            };

            items.unshift(newItem);
            localStorage.setItem('kindi_items', JSON.stringify(items));

            document.getElementById('itemName').value = '';
            document.getElementById('bookQty').value = '';
            document.getElementById('actualQty').value = '';

            renderItems();
        }

        function deleteItem(index) {
            items.splice(index, 1);
            localStorage.setItem('kindi_items', JSON.stringify(items));
            renderItems();
        }

        renderItems();
    </script>
</body>
</html>
