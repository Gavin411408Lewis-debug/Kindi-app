
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANDI - إدارة المواد والمستودعات</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KANDI">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --primary: #007aff;
            --danger: #ff3b30;
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --text: #1c1c1e;
            --border: #e5e5ea;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            font-size: 14px;
        }

        th, td {
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }

        .search-box {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>KANDI - جرد المستودعات</h2>

    <!-- إدخال المادة -->
    <div class="card">
        <div class="form-group">
            <label>رمز المادة</label>
            <input type="text" id="itemCode" placeholder="مثال: 10100001">
        </div>
        <div class="form-group">
            <label>رمز الباركود</label>
            <input type="text" id="barcode" placeholder="مثال: 1">
        </div>
        <div class="form-group">
            <label>الوصف</label>
            <input type="text" id="description" placeholder="مثال: GLYCERL GUIACOLATE">
        </div>
        <div class="form-group">
            <label>وحدة المفرق</label>
            <input type="text" id="unit" placeholder="مثال: KG أو Liter">
        </div>
        <div class="form-group">
            <label>الكمية الموجودة</label>
            <input type="number" step="any" id="quantity" placeholder="0.00">
        </div>
        <button class="btn btn-primary" onclick="addItem()">إضافة مادة</button>
    </div>

    <!-- قائمة المواد -->
    <div class="card">
        <h3>جدول المواد المسجلة</h3>
        <input type="text" id="search" class="search-box" placeholder="بحث بالرمز أو الوصف..." onkeyup="filterItems()">
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>رمز المادة</th>
                        <th>الباركود</th>
                        <th>الوصف</th>
                        <th>الوحدة</th>
                        <th>الكمية</th>
                        <th>حذف</th>
                    </tr>
                </thead>
                <tbody id="itemsList"></tbody>
            </table>
        </div>
        
        <button class="btn btn-danger" onclick="clearAll()" style="margin-top: 15px;">حذف كافة البيانات</button>
    </div>
</div>

<script>
    let items = JSON.parse(localStorage.getItem('kandi_items')) || [];

    function renderItems(data = items) {
        const tbody = document.getElementById('itemsList');
        tbody.innerHTML = '';
        
        data.forEach((item, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.code}</td>
                    <td>${item.barcode}</td>
                    <td>${item.desc}</td>
                    <td>${item.unit}</td>
                    <td><b>${item.qty}</b></td>
                    <td><button onclick="deleteItem(${index})" style="color:red; border:none; background:none; cursor:pointer;">✕</button></td>
                </tr>
            `;
        });
    }

    function addItem() {
        const code = document.getElementById('itemCode').value;
        const barcode = document.getElementById('barcode').value;
        const desc = document.getElementById('description').value;
        const unit = document.getElementById('unit').value;
        const qty = document.getElementById('quantity').value;

        if (!code || !desc) {
            alert('يرجى إدخال رمز المادة والوصف على الأقل!');
            return;
        }

        items.push({ code, barcode, desc, unit, qty });
        localStorage.setItem('kandi_items', JSON.stringify(items));
        renderItems();

        // تفريغ الحقول
        document.getElementById('itemCode').value = '';
        document.getElementById('barcode').value = '';
        document.getElementById('description').value = '';
        document.getElementById('unit').value = '';
        document.getElementById('quantity').value = '';
    }

    function deleteItem(index) {
        items.splice(index, 1);
        localStorage.setItem('kandi_items', JSON.stringify(items));
        renderItems();
    }

    function clearAll() {
        if (confirm('هل أنت تأكد من حذف جميع المواد؟')) {
            items = [];
            localStorage.removeItem('kandi_items');
            renderItems();
        }
    }

    function filterItems() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = items.filter(i => 
            i.code.toLowerCase().includes(query) || 
            i.desc.toLowerCase().includes(query) ||
            i.barcode.toLowerCase().includes(query)
        );
        renderItems(filtered);
    }

    // تشغيل القائمة عند الفتح
    renderItems();
</script>

</body>
</html>
