<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KANDI - إدارة مواد التعبئة والتغليف</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #2d2d2d;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
            --card-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
            padding-top: env(safe-area-inset-top);
        }

        header {
            background-color: var(--card-bg);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* Dashboard Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 16px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }

        .stat-card.danger .number {
            color: var(--danger-color);
        }

        .stat-card.warning .number {
            color: var(--warning-color);
        }

        /* Search & Filter Bar */
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 12px 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        /* Item Cards */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .item-card.low-stock {
            border-color: var(--warning-color);
        }

        .item-card.out-of-stock {
            border-color: var(--danger-color);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .item-name {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            word-break: break-word;
        }

        .item-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge-normal {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
        }

        .badge-warning {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--warning-color);
        }

        .badge-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
        }

        .item-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .item-qty {
            font-weight: 700;
            color: #fff;
            font-size: 1.1rem;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            flex: 1;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .btn-danger {
            color: var(--danger-color);
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* Forms and Inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Modal Overlay */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .export-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>KANDI - مواد التعبئة والتغليف</h1>
    </header>

    <div class="container">
        <!-- Dashboard View -->
        <div id="view-dashboard" class="view-section active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>إجمالي المواد</h3>
                    <div class="number" id="stat-total">0</div>
                </div>
                <div class="stat-card warning">
                    <h3>قريبة من النفاد (&le;1000)</h3>
                    <div class="number" id="stat-low">0</div>
                </div>
                <div class="stat-card danger">
                    <h3>نفدت الرصيد (0)</h3>
                    <div class="number" id="stat-zero">0</div>
                </div>
                <div class="stat-card">
                    <h3>مواد بالكيلوجرام</h3>
                    <div class="number" id="stat-kg">0</div>
                </div>
            </div>

            <div style="margin-bottom: 16px;">
                <h3 style="font-size: 1rem; color: #fff; margin-bottom: 12px;">تنبيهات المواد الحرجة</h3>
                <div id="critical-items-list" class="items-list">
                    <!-- Dynamic Critical Items -->
                </div>
            </div>
        </div>

        <!-- Inventory View -->
        <div id="view-inventory" class="view-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="بحث باسم المادة، المستحضر، أو الكود..." oninput="filterItems()">
            </div>
            <div id="inventory-list" class="items-list">
                <!-- Dynamic Inventory Items -->
            </div>
        </div>

        <!-- Add/Edit View -->
        <div id="view-add" class="view-section">
            <div class="modal-content" style="max-width: 100%; border: none; padding: 0;">
                <div class="modal-title" id="form-title">إضافة مادة جديدة</div>
                <input type="hidden" id="edit-index" value="-1">
                <div class="form-group">
                    <label>اسم المادة</label>
                    <input type="text" id="input-name" class="form-control" placeholder="أدخل اسم المادة بدقة...">
                </div>
                <div class="form-group">
                    <label>الكمية الأولية</label>
                    <input type="number" step="any" id="input-qty" class="form-control" placeholder="0">
                </div>
                <div class="form-group">
                    <label>الوحدة</label>
                    <select id="input-unit" class="form-control">
                        <option value="PCS">PCS</option>
                        <option value="KG">KG</option>
                    </select>
                </div>
                <button class="btn btn-primary" style="padding: 12px;" onclick="saveItem()">حفظ المادة</button>
            </div>
        </div>

        <!-- Settings & Export View -->
        <div id="view-settings" class="view-section">
            <h3 style="font-size: 1rem; color: #fff; margin-bottom: 12px;">إدارة البيانات والتصدير</h3>
            <div class="export-section">
                <button class="btn btn-primary" style="padding: 14px;" onclick="exportToCSV()">تصدير البيانات إلى ملف Excel (CSV)</button>
                <button class="btn btn-danger" style="padding: 14px; margin-top: 10px;" onclick="resetToDefaultData()">استعادة البيانات الأصلية الأساسية</button>
            </div>
        </div>
    </div>

    <!-- Transaction Modal (Add / Deduct) -->
    <div id="transaction-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="trans-title">تعديل كمية المادة</div>
            <input type="hidden" id="trans-index">
            <input type="hidden" id="trans-type">
            <div class="form-group">
                <label id="trans-label">الكمية المراد إضافتها أو خصمها</label>
                <input type="number" step="any" id="trans-qty" class="form-control" placeholder="0">
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="closeModal()">إلغاء</button>
                <button class="btn btn-primary" onclick="executeTransaction()">تأكيد العملية</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchView('dashboard', this)">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            الرئيسية
        </button>
        <button class="nav-item" onclick="switchView('inventory', this)">
            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
            المخزن
        </button>
        <button class="nav-item" onclick="switchView('add', this)">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            إضافة مادة
        </button>
        <button class="nav-item" onclick="switchView('settings', this)">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>

    </nav>

        let inventory = [];

        function initApp() {
            let saved = localStorage.getItem('kandi_inventory');
            if (saved) {
                try {
                    inventory = JSON.parse(saved);
                } catch(e) {
                    inventory = processInitialData(initialRawData);
                }
            } else {
                inventory = processInitialData(initialRawData);
                saveToStorage();
            }
            renderAll();
        }

        function processInitialData(rawData) {
            let map = new Map();
            rawData.forEach(item => {
                let name = item[0].trim();
                let qty = Number(item[1]);
                let unit = item[2];
                let key = name + "_" + unit;
                if (map.has(key)) {
                    map.set(key, map.get(key) + qty);
                } else {
                    map.set(key, { name, qty, unit });
                }
            });
            return Array.from(map.values());
        }

        function saveToStorage() {
            localStorage.setItem('kandi_inventory', JSON.stringify(inventory));
        }

        function switchView(viewId, btnEl) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            if (viewId === 'add') {
                document.getElementById('form-title').innerText = 'إضافة مادة جديدة';
                document.getElementById('edit-index').value = -1;
                document.getElementById('input-name').value = '';
                document.getElementById('input-qty').value = '';
                document.getElementById('input-unit').value = 'PCS';
            }
            renderAll();
        }

        function renderAll() {
            renderDashboard();
            renderInventory();
        }

        function renderDashboard() {
            let total = inventory.length;
            let low = 0;
            let zero = 0;
            let kgCount = 0;
            let criticalHTML = '';

            inventory.forEach((item, index) => {
                if (item.unit === 'KG') kgCount++;
                if (item.qty === 0) {
                    zero++;
                } else if (item.qty <= 1000) {
                    low++;
                }

                if (item.qty <= 1000) {
                    let badgeClass = item.qty === 0 ? 'badge-danger' : 'badge-warning';
                    let badgeText = item.qty === 0 ? 'نفدت' : 'قريبة من النفاد';
                    criticalHTML += `
                        <div class="item-card ${item.qty === 0 ? 'out-of-stock' : 'low-stock'}">
                            <div class="item-header">
                                <span class="item-name">${item.name}</span>
                                <span class="item-badge ${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="item-details">
                                <span>الرصيد الحالي:</span>
                                <span class="item-qty">${item.qty.toLocaleString()} ${item.unit}</span>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-low').innerText = low;
            document.getElementById('stat-zero').innerText = zero;
            document.getElementById('stat-kg').innerText = kgCount;

            document.getElementById('critical-items-list').innerHTML = criticalHTML || '<div style="color:var(--text-muted); text-align:center; padding:20px;">لا توجد مواد قريبة من النفاد حالياً</div>';
        }

        function renderInventory(filteredList = null) {
            let list = filteredList || inventory;
            let html = '';

            list.forEach((item) => {
                let actualIndex = inventory.indexOf(item);
                let badgeClass = 'badge-normal';
                let badgeText = 'متوفر';
                let cardClass = '';

                if (item.qty === 0) {
                    badgeClass = 'badge-danger';
                    badgeText = 'نفدت';
                    cardClass = 'out-of-stock';
                } else if (item.qty <= 1000) {
                    badgeClass = 'badge-warning';
                    badgeText = 'قريبة من النفاد';
                    cardClass = 'low-stock';
                }

                html += `
                    <div class="item-card ${cardClass}">
                        <div class="item-header">
                            <span class="item-name">${item.name}</span>
                            <span class="item-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="item-details">
                            <span>الرصيد:</span>
                            <span class="item-qty">${item.qty.toLocaleString()} ${item.unit}</span>
                        </div>
                        <div class="item-actions">
                            <button class="btn" onclick="openTransactionModal(${actualIndex}, 'add')">إضافة</button>
                            <button class="btn" onclick="openTransactionModal(${actualIndex}, 'deduct')">خصم</button>
                            <button class="btn btn-primary" onclick="editItem(${actualIndex})">تعديل</button>
                            <button class="btn btn-danger" onclick="deleteItem(${actualIndex})">حذف</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('inventory-list').innerHTML = html || '<div style="color:var(--text-muted); text-align:center; padding:20px;">لا توجد نتائج مطابقة للبحث</div>';
        }

        function filterItems() {
            let query = document.getElementById('search-input').value.toLowerCase().trim();
            if (!query) {
                renderInventory();
                return;
            }
            let filtered = inventory.filter(item => item.name.toLowerCase().includes(query));
            renderInventory(filtered);
        }

        function saveItem() {
            let name = document.getElementById('input-name').value.trim();
            let qty = parseFloat(document.getElementById('input-qty').value);
            let unit = document.getElementById('input-unit').value;
            let editIndex = parseInt(document.getElementById('edit-index').value);

            if (!name) {
                alert('يرجى إدخال اسم المادة');
                return;
            }
            if (isNaN(qty) || qty < 0) {
                alert('يرجى إدخال كمية صحيحة');
                return;
            }

            if (editIndex > -1) {
                inventory[editIndex].name = name;
                inventory[editIndex].qty = qty;
                inventory[editIndex].unit = unit;
            } else {
                let existing = inventory.find(i => i.name === name && i.unit === unit);
                if (existing) {
                    existing.qty += qty;
                } else {
                    inventory.push({ name, qty, unit });
                }
            }

            saveToStorage();
            switchView('inventory', document.querySelectorAll('.nav-item')[1]);
        }

        function editItem(index) {
            let item = inventory[index];
            switchView('add', document.querySelectorAll('.nav-item')[2]);
            document.getElementById('form-title').innerText = 'تعديل مادة';
            document.getElementById('edit-index').value = index;
            document.getElementById('input-name').value = item.name;
            document.getElementById('input-qty').value = item.qty;
            document.getElementById('input-unit').value = item.unit;
        }

        function deleteItem(index) {
            if (confirm('هل أنت متأكد من حذف هذه المادة تماماً؟')) {
                inventory.splice(index, 1);
                saveToStorage();
                renderAll();
            }
        }

        function openTransactionModal(index, type) {
            document.getElementById('trans-index').value = index;
            document.getElementById('trans-type').value = type;
            document.getElementById('trans-qty').value = '';
            document.getElementById('trans-title').innerText = type === 'add' ? 'إضافة كمية للمادة' : 'خصم كمية من المادة';
            document.getElementById('trans-label').innerText = type === 'add' ? 'الكمية المراد إضافتها' : 'الكمية المراد خصمها';
            document.getElementById('transaction-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('transaction-modal').classList.remove('open');
        }

        function executeTransaction() {
            let index = parseInt(document.getElementById('trans-index').value);
            let type = document.getElementById('trans-type').value;
            let amount = parseFloat(document.getElementById('trans-qty').value);

            if (isNaN(amount) || amount <= 0) {
                alert('يرجى إدخال كمية صحيحة أكبر من الصفر');
                return;
            }

            if (type === 'add') {
                inventory[index].qty += amount;
            } else {
                if (inventory[index].qty < amount) {
                    alert('الكمية المطلوبة للخصم أكبر من الرصيد الحالي المتاح!');
                    return;
                }
                inventory[index].qty -= amount;
            }

            saveToStorage();
            closeModal();
            renderAll();
        }

        function exportToCSV() {
            let csvContent = "\uFEFFاسم المادة,الرصيد,الوحدة\n";
            inventory.forEach(item => {
                let cleanName = item.name.replace(/"/g, '""');
                csvContent += `"${cleanName}",${item.qty},"${item.unit}"\n`;
            });

            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "kandi_inventory_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function resetToDefaultData() {
            if (confirm('هل أنت متأكد من استعادة البيانات الأصلية؟ سيؤدي ذلك إلى إعادة ضبط أي تعديلات.')) {
                inventory = processInitialData(initialRawData);
                saveToStorage();
                renderAll();
                alert('تمت استعادة البيانات الأصلية بنجاح.');
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
