<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">

<title>جرد مواد التعبئة والتغليف</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#111827,#1e3a5f);
    color:white;
    padding:22px 16px 28px;
    border-radius:0 0 26px 26px;
    box-shadow:0 8px 25px rgba(15,23,42,.18);
}

.header-title{
    font-size:25px;
    font-weight:800;
}

.header-sub{
    opacity:.78;
    margin-top:5px;
    font-size:13px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:-22px;
    position:relative;
}

.stat{
    background:white;
    border-radius:17px;
    padding:15px 10px;
    text-align:center;
    box-shadow:0 5px 20px rgba(15,23,42,.08);
}

.stat-number{
    font-size:22px;
    font-weight:800;
}

.stat-label{
    font-size:12px;
    color:#6b7280;
    margin-top:4px;
}

.toolbar{
    margin-top:15px;
    background:white;
    padding:13px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(15,23,42,.06);
}

.search{
    width:100%;
    border:1px solid #e5e7eb;
    background:#f8fafc;
    padding:14px;
    border-radius:13px;
    font-size:16px;
    outline:none;
}

.search:focus{
    border-color:#2563eb;
    background:white;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
}

button,
.file-label{
    border:0;
    border-radius:12px;
    padding:11px 14px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    background:#eef2ff;
    color:#3730a3;
}

.green{
    background:#dcfce7;
    color:#166534;
}

.orange{
    background:#ffedd5;
    color:#9a3412;
}

.red{
    background:#fee2e2;
    color:#991b1b;
}

input[type=file]{
    display:none;
}

.tabs{
    display:flex;
    gap:8px;
    margin-top:15px;
    overflow-x:auto;
}

.tab{
    white-space:nowrap;
    background:white;
    color:#475569;
    border:1px solid #e5e7eb;
}

.tab.active{
    background:#111827;
    color:white;
}

.info{
    margin-top:12px;
    padding:12px 14px;
    border-radius:13px;
    background:#eff6ff;
    color:#1e40af;
    font-size:13px;
}

.table-wrap{
    margin-top:14px;
    background:white;
    border-radius:18px;
    overflow:auto;
    box-shadow:0 5px 20px rgba(15,23,42,.06);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:780px;
}

th{
    background:#f8fafc;
    color:#475569;
    font-size:13px;
    padding:13px 10px;
    text-align:right;
    position:sticky;
    top:0;
}

td{
    padding:13px 10px;
    border-top:1px solid #f1f5f9;
    font-size:14px;
}

.name{
    font-weight:700;
    max-width:360px;
}

.code{
    color:#64748b;
    font-weight:700;
}

.qty{
    font-size:18px;
    font-weight:900;
}

.unit{
    font-weight:800;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

.badge-ok{
    background:#dcfce7;
    color:#166534;
}

.badge-low{
    background:#fee2e2;
    color:#991b1b;
}

.badge-warning{
    background:#ffedd5;
    color:#9a3412;
}

.action-btn{
    padding:8px 10px;
    font-size:12px;
    margin:2px;
}

.empty{
    text-align:center;
    padding:40px 15px;
    color:#64748b;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    z-index:1000;
    padding:20px;
    align-items:center;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:430px;
    border-radius:22px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.modal-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:15px;
}

.modal-input{
    width:100%;
    padding:13px;
    border:1px solid #e5e7eb;
    border-radius:12px;
    font-size:17px;
    margin-bottom:12px;
    outline:none;
}

.modal-actions{
    display:flex;
    gap:8px;
}

.modal-actions button{
    flex:1;
}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#111827;
    color:white;
    padding:13px 18px;
    border-radius:13px;
    z-index:2000;
    transition:.3s;
    font-size:13px;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
}

.toast.show{
    transform:translateX(-50%) translateY(0);
}

@media(max-width:600px){
    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .stat-number{
        font-size:18px;
    }

    .stat{
        padding:12px 5px;
    }

    .header-title{
        font-size:21px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-title">📦 جرد مواد التعبئة والتغليف</div>
    <div class="header-sub">إدارة الأرصدة الفعلية للمواد</div>
</header>

<div class="container">

    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="totalMaterials">0</div>
            <div class="stat-label">كل المواد</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="pcsCount">0</div>
            <div class="stat-label">مواد PCS</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="kgCount">0</div>
            <div class="stat-label">مواد KG</div>
        </div>
    </div>

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔎 ابحث بالكود أو اسم المادة أو المنتج..."
        >

        <div class="buttons">

            <label class="file-label primary">
                📂 تحميل ملف Excel
                <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
            </label>

            <button class="secondary" onclick="exportExcel()">
                📊 تصدير Excel
            </button>

            <button class="green" onclick="addStockPrompt()">
                ➕ إضافة رصيد
            </button>

            <button class="orange" onclick="withdrawPrompt()">
                ➖ سحب رصيد
            </button>

            <button class="red" onclick="showLowStock()">
                ⚠️ المواد الناقصة
            </button>

        </div>

        <div class="tabs">
            <button class="tab active" onclick="setFilter('ALL',this)">الكل</button>
            <button class="tab" onclick="setFilter('PCS',this)">PCS</button>
            <button class="tab" onclick="setFilter('KG',this)">KG</button>
            <button class="tab" onclick="setFilter('LOW',this)">⚠️ تنبيه</button>
        </div>

        <div class="info">
            💡 الأرصدة المعروضة مأخوذة من ملف Excel نفسه، ويمكن تعديلها بالسحب والإضافة.
        </div>

    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الكود</th>
                    <th>المادة</th>
                    <th>الوحدة</th>
                    <th>الرصيد</th>
                    <th>الحالة</th>
                    <th>العملية</th>
                </tr>
            </thead>

            <tbody id="materialsBody"></tbody>
        </table>
    </div>

</div>

<div class="modal" id="modal">
    <div class="modal-box">

        <div class="modal-title" id="modalTitle"></div>

        <input
            id="modalValue"
            class="modal-input"
            type="number"
            step="any"
            min="0"
            placeholder="أدخل الكمية"
        >

        <div class="modal-actions">
            <button class="secondary" onclick="closeModal()">إلغاء</button>
            <button class="primary" onclick="confirmModal()">تأكيد</button>
        </div>

    </div>
</div>

<div class="toast" id="toast"></div>

<script>

let materials = [];
let currentFilter = "ALL";
let currentAction = null;
let currentMaterialIndex = null;

/* =========================
   تحميل البيانات
========================= */

document.getElementById("excelFile").addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        try{

            const data = new Uint8Array(event.target.result);

            const workbook = XLSX.read(data,{
                type:"array"
            });

            const sheetName = workbook.SheetNames[0];

            const sheet = workbook.Sheets[sheetName];

            const rows = XLSX.utils.sheet_to_json(sheet,{
                defval:""
            });

            if(!rows.length){

                showToast("❌ الملف فارغ");

                return;
            }

            materials = convertExcelRows(rows);

            saveData();

            render();

            showToast(
                "✅ تم تحميل " + materials.length + " مادة مع أرصدتها"
            );

        }catch(error){

            console.error(error);

            showToast("❌ صار خطأ بقراءة ملف Excel");

        }

    };

    reader.readAsArrayBuffer(file);

});


/* =========================
   تحويل Excel
========================= */

function convertExcelRows(rows){

    return rows.map((row,index)=>{

        const keys = Object.keys(row);

        const codeKey = findKey(
            keys,
            [
                "code",
                "كود",
                "الكود",
                "رقم المادة",
                "رمز المادة"
            ]
        );

        const nameKey = findKey(
            keys,
            [
                "name",
                "اسم",
                "اسم المادة",
                "المادة",
                "description",
                "الوصف",
                "وصف"
            ]
        );

        const qtyKey = findKey(
            keys,
            [
                "quantity",
                "qty",
                "الكمية",
                "الرصيد",
                "الرصيد الحالي",
                "كمية"
            ]
        );

        const unitKey = findKey(
            keys,
            [
                "unit",
                "الوحدة",
                "وحدة"
            ]
        );

        const productKey = findKey(
            keys,
            [
                "product",
                "product name",
                "اسم المنتج",
                "المستحضر",
                "المنتج"
            ]
        );

        let code = codeKey !== null ? row[codeKey] : "";

        let name = nameKey !== null ? row[nameKey] : "";

        let quantity = qtyKey !== null
            ? parseNumber(row[qtyKey])
            : 0;

        let unit = unitKey !== null
            ? normalizeUnit(row[unitKey])
            : detectUnit(row);

        let product = productKey !== null
            ? row[productKey]
            : "";

        return {

            id: String(code || ("MAT-" + (index+1))),

            code: String(code || "").trim(),

            name: String(name || "").trim(),

            product: String(product || "").trim(),

            quantity: quantity,

            unit: unit

        };

    });

}


/* =========================
   البحث عن العمود
========================= */

function findKey(keys, candidates){

    for(const key of keys){

        const normalizedKey = normalizeText(key);

        for(const candidate of candidates){

            if(
                normalizedKey === normalizeText(candidate) ||
                normalizedKey.includes(normalizeText(candidate))
            ){
                return key;
            }

        }

    }

    return null;
}


function normalizeText(value){

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[أإآ]/g,"ا")
        .replace(/ة/g,"ه")
        .replace(/\s+/g," ");

}


/* =========================
   تحويل الرقم
========================= */

function parseNumber(value){

    if(typeof value === "number"){

        return isFinite(value) ? value : 0;

    }

    let text = String(value || "").trim();

    if(!text) return 0;

    text = text
        .replace(/٬/g,"")
        .replace(/,/g,"")
        .replace(/[^\d.-]/g,"");

    const number = Number(text);

    return isFinite(number) ? number : 0;

}


/* =========================
   الوحدة
========================= */

function normalizeUnit(value){

    let unit = String(value || "")
        .trim()
        .toUpperCase();

    if(
        unit.includes("KG") ||
        unit.includes("KILO") ||
        unit.includes("كيلو") ||
        unit.includes("كغم") ||
        unit.includes("كغ")
    ){
        return "KG";
    }

    if(
        unit.includes("PCS") ||
        unit.includes("PC") ||
        unit.includes("PIECE") ||
        unit.includes("قطعة") ||
        unit.includes("قطعه")
    ){
        return "PCS";
    }

    return unit || "PCS";

}


function detectUnit(row){

    const text = Object.values(row)
        .join(" ")
        .toUpperCase();

    if(
        text.includes("KG") ||
        text.includes("KILO") ||
        text.includes("كيلو") ||
        text.includes("كغم")
    ){
        return "KG";
    }

    return "PCS";

}


/* =========================
   التخزين
========================= */

function saveData(){

    localStorage.setItem(
        "packaging_inventory_v2",
        JSON.stringify(materials)
    );

}


function loadData(){

    try{

        const saved = localStorage.getItem(
            "packaging_inventory_v2"
        );

        if(saved){

            materials = JSON.parse(saved);

        }

    }catch(error){

        materials = [];

    }

}


/* =========================
   البحث
========================= */

document.getElementById("search").addEventListener(
    "input",
    render
);


/* =========================
   الفلاتر
========================= */

function setFilter(filter,button){

    currentFilter = filter;

    document.querySelectorAll(".tab").forEach(
        b => b.classList.remove("active")
    );

    if(button){
        button.classList.add("active");
    }

    render();

}


/* =========================
   حالة المادة
========================= */

function isLow(material){

    if(material.unit === "KG"){

        return material.quantity <= 50;

    }

    return material.quantity <= 20000;

}


function getStatus(material){

    if(isLow(material)){

        return {
            text:"⚠️ قريب من النفاد",
            className:"badge-low"
        };

    }

    return {
        text:"✓ جيد",
        className:"badge-ok"
    };

}


/* =========================
   عرض البيانات
========================= */

function render(){

    const body = document.getElementById("materialsBody");

    const search = document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();

    let filtered = materials.filter(material=>{

        const searchable = (
            material.code + " " +
            material.name + " " +
            material.product
        ).toLowerCase();

        const matchesSearch =
            !search ||
            searchable.includes(search);

        let matchesFilter = true;

        if(currentFilter === "PCS"){

            matchesFilter = material.unit === "PCS";

        }

        if(currentFilter === "KG"){

            matchesFilter = material.unit === "KG";

        }

        if(currentFilter === "LOW"){

            matchesFilter = isLow(material);

        }

        return matchesSearch && matchesFilter;

    });


    if(!filtered.length){

        body.innerHTML = `
            <tr>
                <td colspan="7">
                    <div class="empty">
                        📭 لا توجد مواد مطابقة
                    </div>
                </td>
            </tr>
        `;

    }else{

        body.innerHTML = filtered.map((material)=>{

            const originalIndex =
                materials.indexOf(material);

            const status = getStatus(material);

            return `
                <tr>

                    <td>${originalIndex + 1}</td>

                    <td class="code">
                        ${escapeHTML(material.code)}
                    </td>

                    <td class="name">
                        ${escapeHTML(material.name)}
                        ${
                            material.product
                            ? `<br><small style="color:#64748b">
                                ${escapeHTML(material.product)}
                               </small>`
                            : ""
                        }
                    </td>

                    <td class="unit">
                        ${material.unit}
                    </td>

                    <td class="qty">
                        ${formatNumber(material.quantity)}
                    </td>

                    <td>
                        <span class="badge ${status.className}">
                            ${status.text}
                        </span>
                    </td>

                    <td>

                        <button
                            class="action-btn green"
                            onclick="openAction(${originalIndex},'add')"
                        >
                            ➕ إضافة
                        </button>

                        <button
                            class="action-btn orange"
                            onclick="openAction(${originalIndex},'withdraw')"
                        >
                            ➖ سحب
                        </button>

                    </td>

                </tr>
            `;

        }).join("");

    }


    updateStats();

}


/* =========================
   الإحصائيات
========================= */

function updateStats(){

    document.getElementById("totalMaterials").textContent =
        materials.length;

    document.getElementById("pcsCount").textContent =
        materials.filter(m=>m.unit==="PCS").length;

    document.getElementById("kgCount").textContent =
        materials.filter(m=>m.unit==="KG").length;

}


/* =========================
   تنسيق الأرقام
========================= */

function formatNumber(value){

    if(!isFinite(value)) return "0";

    return Number(value).toLocaleString(
        "en-US",
        {
            maximumFractionDigits:8
        }
    );

}


/* =========================
   العمليات
========================= */

function openAction(index,action){

    currentMaterialIndex = index;

    currentAction = action;

    const material = materials[index];

    document.getElementById("modalTitle").textContent =
        action === "add"
        ? "➕ إضافة رصيد"
        : "➖ سحب من الرصيد";

    document.getElementById("modalValue").value = "";

    document.getElementById("modalValue").placeholder =
        "الرصيد الحالي: " +
        formatNumber(material.quantity) +
        " " +
        material.unit;

    document.getElementById("modal").classList.add("show");

    setTimeout(()=>{
        document.getElementById("modalValue").focus();
    },100);

}


function addStockPrompt(){

    if(!materials.length){

        showToast("⚠️ أولاً حمّل ملف Excel");

        return;

    }

    const search = document.getElementById("search").value.trim();

    if(search){

        const index = materials.findIndex(m=>
            (
                m.code + " " +
                m.name + " " +
                m.product
            ).toLowerCase().includes(search.toLowerCase())
        );

        if(index >= 0){

            openAction(index,"add");

            return;

        }

    }

    showToast("🔎 ابحث عن المادة أولاً ثم اضغط إضافة");

}


function withdrawPrompt(){

    if(!materials.length){

        showToast("⚠️ أولاً حمّل ملف Excel");

        return;

    }

    const search = document.getElementById("search").value.trim();

    if(search){

        const index = materials.findIndex(m=>
            (
                m.code + " " +
                m.name + " " +
                m.product
            ).toLowerCase().includes(search.toLowerCase())
        );

        if(index >= 0){

            openAction(index,"withdraw");

            return;

        }

    }

    showToast("🔎 ابحث عن المادة أولاً ثم اضغط سحب");

}


function confirmModal(){

    const input = document.getElementById("modalValue");

    const amount = Number(input.value);

    if(!isFinite(amount) || amount <= 0){

        showToast("❌ أدخل كمية صحيحة");

        return;

    }

    const material = materials[currentMaterialIndex];

    if(currentAction === "add"){

        material.quantity += amount;

        showToast(
            "✅ تمت إضافة " +
            formatNumber(amount) +
            " " +
            material.unit
        );

    }else{

        if(amount > material.quantity){

            showToast(
                "❌ الكمية المطلوبة أكبر من الرصيد الحالي"
            );

            return;

        }

        material.quantity -= amount;

        showToast(
            "✅ تم سحب " +
            formatNumber(amount) +
            " " +
            material.unit
        );

    }

    saveData();

    closeModal();

    render();

}


function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");

}


/* =========================
   المواد الناقصة
========================= */

function showLowStock(){

    currentFilter = "LOW";

    document.querySelectorAll(".tab").forEach(
        b=>b.classList.remove("active")
    );

    document
        .querySelectorAll(".tab")[3]
        .classList.add("active");

    render();

    showToast(
        "⚠️ تم عرض المواد التي وصلت لحد التنبيه"
    );

}


/* =========================
   تصدير Excel
========================= */

function exportExcel(){

    if(!materials.length){

        showToast("⚠️ لا توجد بيانات للتصدير");

        return;

    }

    const data = materials.map(m=>({

        Code:m.code,

        Name:m.name,

        Product:m.product,

        Quantity:m.quantity,

        Unit:m.unit

    }));

    const worksheet =
        XLSX.utils.json_to_sheet(data);

    const workbook =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Materials"
    );

    XLSX.writeFile(
        workbook,
        "مواد_تعبئة_وتغليف_الرصيد.xlsx"
    );

    showToast("✅ تم تصدير الملف");

}


/* =========================
   حماية HTML
========================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   إشعار
========================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(()=>{

        toast.classList.remove("show");

    },3000);

}
