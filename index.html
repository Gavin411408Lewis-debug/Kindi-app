<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KANDI</title>

  <!-- إعدادات تطبيق الآيفون PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KANDI">
  <link rel="manifest" href="manifest.json">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f4f5f7; color: #222; }
    h2 { text-align: center; color: #111827; }
    .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background: #007aff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button.danger { background: #ff3b30; }
    .item { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid #007aff; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .item-details p { margin: 2px 0; }
  </style>
</head>
<body>

  <h2>تطبيق KANDI</h2>

  <div class="card">
    <input type="text" id="mealName" placeholder="اسم الوجبة">
    <input type="text" id="mealNumber" placeholder="رقم الوجبة">
    <input type="number" id="mealQty" placeholder="كمية الوجبة">
    <input type="text" id="mealResult" placeholder="النتيجة">
    <button onclick="addMeal()">حفظ الوجبة</button>
  </div>

  <button class="danger" onclick="clearAll()">حذف جميع الوجبات</button>

  <h3>الوجبات المحفوظة</h3>
  <div id="mealsList"></div>

  <script>
    function loadMeals() {
      const meals = JSON.parse(localStorage.getItem('kandi_meals') || '[]');
      const list = document.getElementById('mealsList');
      list.innerHTML = '';
      meals.forEach((m, index) => {
        list.innerHTML += `
          <div class="item">
            <div class="item-details">
              <strong>${safe(m.name)}</strong>
              <p>رقم الوجبة: ${safe(m.num)}</p>
              <p>الكمية: ${safe(m.qty)}</p>
              <p>النتيجة: ${safe(m.result)}</p>
            </div>
            <button class="danger" style="width:auto; padding:6px 12px;" onclick="deleteMeal(${index})">حذف</button>
          </div>
        `;
      });
    }

    function addMeal() {
      const name = document.getElementById('mealName').value;
      const num = document.getElementById('mealNumber').value;
      const qty = document.getElementById('mealQty').value;
      const result = document.getElementById('mealResult').value;

      if (!name) return alert('يرجى ادخال اسم الوجبة');

      const meals = JSON.parse(localStorage.getItem('kandi_meals') || '[]');
      meals.push({ name, num, qty, result });
      localStorage.setItem('kandi_meals', JSON.stringify(meals));

      document.getElementById('mealName').value = '';
      document.getElementById('mealNumber').value = '';
      document.getElementById('mealQty').value = '';
      document.getElementById('mealResult').value = '';

      loadMeals();
    }

    function deleteMeal(index) {
      const meals = JSON.parse(localStorage.getItem('kandi_meals') || '[]');
      meals.splice(index, 1);
      localStorage.setItem('kandi_meals', JSON.stringify(meals));
      loadMeals();
    }

    function clearAll() {
      if (confirm('هل أنت متاكد من حذف جميع الوجبات؟')) {
        localStorage.removeItem('kandi_meals');
        loadMeals();
      }
    }

    function safe(x) {
      return String(x || '-')
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadMeals();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
