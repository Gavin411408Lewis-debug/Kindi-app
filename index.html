<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المخزن - شركة الكندي</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
            --border-color: #2c2c2c;
            --input-bg: #2d2d2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px; /* مساحة لشريط التنقل السفلي */
            direction: rtl;
        }

        header {
            text-align: center;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* لوحة الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .stat-card.full-width {
            grid-column: span 2;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .text-danger { color: var(--danger-color); }
        .text-warning { color: var(--warning-color); }
        .text-success { color: var(--accent-color); }

        /* قسم استيراد الملفات */
        .import-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            text-align: center;
        }

        .file-input-label {
            display: block;
            background-color: var(--input-bg);
            border: 2px dashed var(--accent-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-top: 8px;
        }

        input[type="file"] {
            display: none;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 16px 0 10px 0;
            color: var(--text-color);
        }

        /* بطاقات المواد */
        .item-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            position: relative;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .badge-warning { background-color: rgba(245, 158, 11, 0.15); color: var(--warning-color); }
        .badge-danger { background-color: rgba(239, 68, 68, 0.15); color: var(--danger-color); }
        .badge-normal { background-color: rgba(59, 130, 246, 0.15); color: var(--accent-color); }

        .item-code {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .item-name {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .item-qty {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .item-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .btn {
            padding: 6px 0;
            border-radius: 6px;
            border: none;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .btn-add { background-color: rgba(16, 185, 129, 0.2); color: var(--success-color); }
        .btn-sub { background-color: rgba(239, 68, 68, 0.2); color: var(--danger-color); }
        .btn-edit { background-color: rgba(59, 130, 246, 0.2); color: var(--accent-color); }
        .btn-del { background-color: rgba(239, 68, 68, 0.2); color: var(--danger-color); }

        /* شريط التنقل السفلي (مثل الصورة) */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

.nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <header>
        StockFlow - إدارة المخزن (<span id="totalCount">0</span> مادة)
    </header>

    <div class="container">
        
        <!-- إحصائيات المخزن -->
        <div class="stats-grid">
            <div class="stat-card full-width">
                <div class="stat-label">إجمالي مواد المخزن</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">منتهية</div>
                <div class="stat-value text-danger" id="statExpired">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">قريبة من النفاد</div>
                <div class="stat-value text-warning" id="statWarning">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">مواد KG</div>
                <div class="stat-value" id="statKg">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">مواد PCS</div>
                <div class="stat-value" id="statPcs">0</div>
            </div>
        </div>

        <!-- صندوق استيراد الملفات -->
        <div class="import-section">
            <div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 4px;">استيراد المواد دفعة واحدة</div>
            <p style="font-size: 0.75rem; color: var(--text-secondary);">اختر ملف (JSON أو CSV) يحتوي على المواد ليتم إضافتها تلقائياً.</p>
            <label class="file-input-label">
                اختر ملف المواد
                <input type="file" id="fileUpload" accept=".json,.csv,.txt" onchange="handleFileUpload(event)">
            </label>
        </div>

        <div class="section-title">المواد المخزنة</div>
        <div id="itemsListContainer">
            <p style="text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-top: 20px;">لا توجد مواد حالياً. قم برفع ملف لإضافة المواد.</p>
        </div>

    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            الرئيسية
        </button>
        <button class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            المخزن
        </button>
        <button class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            إضافة
        </button>
        <button class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            الإعدادات
        </button>
    </nav>

    <script>
        // مصفوفة تخزين المواد
        let inventoryItems = [];

        // دالة قراءة الملف المرفوع وإضافة المواد دفعة واحدة
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    // فحص إذا كان الملف بصيغة JSON
                    if (file.name.endsWith('.json') || content.trim().startsWith('[')) {
                        const parsedData = JSON.parse(content);
                        if (Array.isArray(parsedData)) {
                            inventoryItems = parsedData;
                        } else {
                            throw new Error("الملف يجب أن يحتوي على مصفوفة بيانات");
                        }
                    } else {
                        // معالجة ملفات النص/CSV البسيطة (كل سطر: الاسم,الرمز,الكمية,الوحدة,الحالة)
                        const lines = content.split('\n');
                        inventoryItems = [];
                        lines.forEach((line, index) => {
                            if (line.trim() !== '') {
                                const parts = line.split(',');
                                if (parts.length >= 3) {
                                    inventoryItems.push({
                                        id: Date.now() + index,
                                        code: parts[0].trim(),
                                        name: parts[1].trim(),
                                        qty: parts[2].trim(),
                                        unit: parts[3] ? parts[3].trim() : 'KG',
                                        status: parts[4] ? parts[4].trim() : 'عادي'
                                    });
                                }
                            }
                        });
                    }
                    updateDashboard();
                    alert('تم استيراد المواد بنجاح!');
                } catch (error) {
                    alert('خطأ في قراءة الملف. تأكد من صحة تنسيق الملف.');
                    console.error(error);
                }
            };
            reader.readAsText(file);
        }

        // تحديث الواجهة والإحصائيات
        function updateDashboard() {
            const totalCount = inventoryItems.length;
            document.getElementById('totalCount').innerText = totalCount;
            document.getElementById('statTotal').innerText = totalCount;

            let expiredCount = 0;
            let warningCount = 0;
            let kgCount = 0;
            let pcsCount = 0;

            let html = '';

            inventoryItems.forEach(item => {
                const unit = (item.unit || 'KG').toUpperCase();
                if (unit === 'KG') kgCount++;
                if (unit === 'PCS') pcsCount++;

                let badgeClass = 'badge-normal';
                let statusText = item.status || 'متوفر';

                if (statusText.includes('منتهية') || statusText.includes('منتهي')) {
                    expiredCount++;
                    badgeClass = 'badge-danger';
                } else if (statusText.includes('قريبة') || statusText.includes('تحذير')) {
                    warningCount++;
                    badgeClass = 'badge-warning';
                }

                html += `
                    <div class="item-card">
                        <div class="item-header">
                            <span class="badge ${badgeClass}">${statusText}</span>
                            <span class="item-code">${item.code}</span>
                        </div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-qty">${unit} ${item.qty}</div>
                        <div class="item-actions">
                            <button class="btn btn-add" onclick="modifyQty(${item.id}, 10)">+ إضافة</button>
                            <button class="btn btn-sub" onclick="modifyQty(${item.id}, -10)">- سحب</button>
                            <button class="btn btn-edit" onclick="editItem(${item.id})">تعديل</button>
                            <button class="btn btn-del" onclick="deleteItem(${item.id})">حذف</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('statExpired').innerText = expiredCount;
            document.getElementById('statWarning').innerText = warningCount;
            document.getElementById('statKg').innerText = kgCount;
            document.getElementById('statPcs').innerText = pcsCount;

            const container = document.getElementById('itemsListContainer');
            if (inventoryItems.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var_text-secondary; font-size: 0.85rem; margin-top: 20px;">لا توجد مواد حالياً. قم برفع ملف لإضافة المواد.</p>`;
            } else {
                container.innerHTML = html;
            }
        }

        function deleteItem(id) {
            inventoryItems = inventoryItems.filter(item => item.id !== id);
            updateDashboard();
        }

        function modifyQty(id, amount) {
            const item = inventoryItems.find(i => i.id === id);
            if (item) {
                let currentQty = parseFloat(item.qty) || 0;
                currentQty = Math.max(0, currentQty + amount);
                item.qty = currentQty.toString();
                updateDashboard();
            }
        }

        function editItem(id) {
            const item = inventoryItems.find(i => i.id === id);
            if (item) {
                const newName = prompt("تعديل اسم المادة:", item.name);
                if (newName !== null) {
                    item.name = newName;
                    updateDashboard();
                }
            }
        }
    </script>
</body>
</html>
