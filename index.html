<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stock Manager</title>

<style>
:root{
 --bg:#101114;
 --card:#1b1d21;
 --card2:#22252a;
 --text:#f5f5f5;
 --muted:#9ca3af;
 --blue:#3b82f6;
 --green:#10b981;
 --yellow:#f59e0b;
 --red:#ef4444;
 --border:#30343b;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
 background:var(--bg);
 color:var(--text);
 padding-bottom:90px;
}

header{
 position:sticky;
 top:0;
 z-index:100;
 background:var(--card);
 border-bottom:1px solid var(--border);
 padding:15px;
 text-align:center;
}

header h1{
 font-size:19px;
}

.container{
 max-width:650px;
 margin:auto;
 padding:15px;
}

.view{
 display:none;
}

.view.active{
 display:block;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.stat{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:14px;
 padding:16px;
 text-align:center;
}

.stat small{
 color:var(--muted);
}

.stat strong{
 display:block;
 font-size:24px;
 margin-top:6px;
}

.search{
 width:100%;
 padding:14px;
 background:var(--card);
 color:white;
 border:1px solid var(--border);
 border-radius:12px;
 outline:none;
 margin-bottom:15px;
 font-size:16px;
}

.section{
 margin-top:20px;
 margin-bottom:10px;
 color:var(--blue);
 font-weight:bold;
 border-bottom:1px solid var(--border);
 padding-bottom:7px;
}

.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:14px;
 padding:14px;
 margin-bottom:10px;
}

.card.low{
 border-color:var(--yellow);
}

.card.empty{
 border-color:var(--red);
}

.name{
 font-weight:bold;
 font-size:15px;
 line-height:1.5;
}

.code{
 color:var(--blue);
 font-size:12px;
 margin-top:3px;
}

.qty{
 font-size:21px;
 font-weight:bold;
 margin-top:8px;
}

.info{
 color:var(--muted);
 font-size:13px;
 margin-top:4px;
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr 1fr 1fr;
 gap:6px;
 margin-top:12px;
 padding-top:10px;
 border-top:1px solid var(--border);
}

button{
 border:0;
 border-radius:9px;
 padding:10px 7px;
 color:white;
 background:var(--card2);
 cursor:pointer;
}

.btn-add{
 background:var(--green);
}

.btn-out{
 background:var(--yellow);
 color:#111;
}

.btn-edit{
 background:var(--blue);
}

.btn-delete{
 background:var(--red);
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:1000;
 background:var(--card);
 border-top:1px solid var(--border);
 display:grid;
 grid-template-columns:repeat(5,1fr);
 padding:8px 3px calc(8px + env(safe-area-inset-bottom));
}

.nav button{
 background:none;
 color:var(--muted);
 font-size:11px;
}

.nav button.active{
 color:var(--blue);
}

.form{
 background:var(--card);
 padding:15px;
 border-radius:14px;
}

label{
 display:block;
 color:var(--muted);
 font-size:13px;
 margin-bottom:6px;
}

input,select{
 width:100%;
 padding:13px;
 margin-bottom:13px;
 background:var(--card2);
 border:1px solid var(--border);
 border-radius:10px;
 color:white;
 font-size:16px;
}

.primary{
 width:100%;
 background:var(--blue);
 padding:14px;
 font-size:16px;
}

.modal{
 position:fixed;
 inset:0;
 background:#000b;
 z-index:3000;
 display:none;
 align-items:center;
 justify-content:center;
 padding:18px;
}

.modal.open{
 display:flex;
}

.modal-box{
 background:var(--card);
 width:100%;
 max-width:430px;
 border-radius:16px;
 padding:18px;
}

.modal-title{
 font-size:18px;
 font-weight:bold;
 margin-bottom:15px;
}

.modal-buttons{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.notice{
 background:var(--red);
 padding:12px;
 border-radius:12px;
 margin-bottom:10px;
 font-weight:bold;
}

.notice.warning{
 background:var(--yellow);
 color:#111;
}

.history{
 font-size:13px;
 padding:10px 0;
 border-bottom:1px solid var(--border);
}

.empty-msg{
 text-align:center;
 color:var(--muted);
 padding:25px;
}
</style>
</head>

<body>

<header>
<h1>Stock Manager</h1>
</header>

<div class="container">

<!-- الرئيسية -->
<section id="dashboard" class="view active">

<div id="notifications"></div>

<div class="grid">
<div class="stat">
<small>إجمالي المواد</small>
<strong id="total">0</strong>
</div>

<div class="stat">
<small>مواد KG</small>
<strong id="kgCount">0</strong>
</div>

<div class="stat">
<small>مواد PCS</small>
<strong id="pcsCount">0</strong>
</div>

<div class="stat">
<small>مواد حرجة</small>
<strong id="lowCount">0</strong>
</div>

<div class="stat">
<small>مواد نفدت</small>
<strong id="zeroCount">0</strong>
</div>

<div class="stat">
<small>الإشعارات</small>
<strong id="notificationCount">0</strong>
</div>
</div>

<div class="section">المواد الحرجة</div>
<div id="critical"></div>

</section>


<!-- KG -->
<section id="kg" class="view">

<input
 id="kgSearch"
 class="search"
 placeholder="ابحث بالاسم أو الرمز أو القياس..."
 oninput="renderKG()">

<div class="section">مواد KG</div>
<div id="kgList"></div>

</section>


<!-- PCS -->
<section id="pcs" class="view">

<input
 id="pcsSearch"
 class="search"
 placeholder="ابحث بالاسم أو الرمز..."
 oninput="renderPCS()">

<div class="section">مواد PCS</div>
<div id="pcsList"></div>

</section>


<!-- الحركات -->
<section id="history" class="view">

<div class="section">سجل الحركات</div>

<div id="historyList"></div>

</section>


<!-- الإعدادات -->
<section id="settings" class="view">

<div class="section">الإعدادات</div>

<div class="form">

<label>حد التنبيه</label>
<input id="limitInput" type="number" value="1000">

<label>الإشعارات</label>
<select id="notificationSetting">
<option value="on">تشغيل</option>
<option value="off">إيقاف</option>
</select>

<button class="primary" onclick="saveSettings()">
حفظ الإعدادات
</button>

<br><br>

<button class="primary" onclick="exportCSV()">
تصدير البيانات
</button>

<br><br>

<button class="btn-delete" style="width:100%" onclick="restoreData()">
استعادة البيانات الأصلية
</button>

</div>

</section>


<!-- إضافة مادة -->
<section id="add" class="view">

<div class="section">إضافة مادة جديدة</div>

<div class="form">

<label>رمز المادة</label>
<input id="newCode" placeholder="مثال: 100245">

<label>اسم المادة</label>
<input id="newName" placeholder="اسم المادة">

<label>الكمية</label>
<input id="newQty" type="number" step="any">

<label>الوحدة</label>
<select id="newUnit">
<option value="PCS">PCS</option>
<option value="KG">KG</option>
</select>

<button class="primary" onclick="addNewMaterial()">
حفظ المادة
</button>

</div>

</section>

</div>


<!-- شريط التنقل -->

<nav class="nav">

<button class="active" onclick="showView('dashboard',this)">
🏠<br>الرئيسية
</button>

<button onclick="showView('kg',this)">
⚖️<br>KG
</button>

<button onclick="showView('pcs',this)">
📦<br>PCS
</button>

<button onclick="showView('history',this)">
📋<br>الحركات
</button>

<button onclick="showView('settings',this)">
⚙️<br>الإعدادات
</button>

</nav>


<!-- نافذة السحب والإضافة -->

<div id="transactionModal" class="modal">

<div class="modal-box">

<div id="transactionTitle" class="modal-title">
حركة مادة
</div>

<input type="hidden" id="transactionIndex">

<label>الكمية</label>

<input
 id="transactionQty"
 type="number"
 step="any"
 placeholder="أدخل الكمية">

<div class="modal-buttons">

<button onclick="closeModal()">
إلغاء
</button>

<button id="transactionButton" class="btn-add">
تأكيد
</button>

</div>

</div>

</div>


<!-- نافذة التعديل -->

<div id="editModal" class="modal">

<div class="modal-box">

<div class="modal-title">
تعديل المادة
</div>

<input type="hidden" id="editIndex">

<label>رمز المادة</label>
<input id="editCode">

<label>اسم المادة</label>
<input id="editName">

<label>الكمية</label>
<input id="editQty" type="number" step="any">

<label>الوحدة</label>

<select id="editUnit">
<option value="PCS">PCS</option>
<option value="KG">KG</option>
</select>

<div class="modal-buttons">

<button onclick="closeEdit()">
إلغاء
</button>

<button class="btn-edit" onclick="saveEdit()">
حفظ
</button>

</div>

</div>

</div>


<script>

/* =====================================================
   بيانات المواد
   =====================================================

   مهم جداً:
   ضع هنا initialRawData الموجود عندك بالكامل
   كما هو من الكود السابق.

   الصيغة:

   ["رمز المادة","اسم المادة",الكمية,"PCS"]

   أو:

   ["رمز المادة","اسم المادة",الكمية,"KG"]

   ===================================================== */

const initialRawData = [

/*
مثال فقط:

["001","PACKET POVIDONE IODINE KINDI 47",24999,"PCS"],
["002","ALU FOIL CALCIUM-KINDI (243MM)",84.4,"KG"],
["003","ALU FOIL KINDIFED (243 MM)",91.15,"KG"]

ضع هنا كل موادك وكمياتها الموجودة بالكود السابق.
*/

];


/* =====================================================
   المتغيرات
   ===================================================== */

let inventory=[];
let historyData=[];

let settings={
 limit:1000,
 notifications:true
};


/* =====================================================
   تشغيل البرنامج
   ===================================================== */

function init(){

let saved=localStorage.getItem("stock_inventory");

if(saved){

try{
 inventory=JSON.parse(saved);
}catch{
 inventory=processData(initialRawData);
}

}else{

inventory=processData(initialRawData);
save();

}

let savedHistory=localStorage.getItem("stock_history");

if(savedHistory){
 try{
  historyData=JSON.parse(savedHistory);
 }catch{
  historyData=[];
 }
}

let savedSettings=localStorage.getItem("stock_settings");

if(savedSettings){
 try{
  settings=JSON.parse(savedSettings);
 }catch{}
}

document.getElementById("limitInput").value=settings.limit;

document.getElementById("notificationSetting").value=
settings.notifications ? "on":"off";

renderAll();

}


/* =====================================================
   معالجة البيانات
   ===================================================== */

function processData(data){

let result=[];

data.forEach(x=>{

let code=String(x[0]||"").trim();
let name=String(x[1]||"").trim();
let qty=Number(x[2])||0;
let unit=x[3];

if(!name)return;


/*
   مهم:
   لا يتم دمج المواد المتشابهة بالاسم.

   الدمج فقط إذا:
   الرمز + الاسم + الوحدة
   متطابقين تماماً.
*/

let existing=result.find(i=>
 i.code===code &&
 i.name===name &&
 i.unit===unit
);

if(existing){

existing.qty+=qty;

}else{

result.push({
 code,
 name,
 qty,
 unit
});

}

});

return result;

}


/* =====================================================
   حفظ
   ===================================================== */

function save(){

localStorage.setItem(
 "stock_inventory",
 JSON.stringify(inventory)
);

localStorage.setItem(
 "stock_history",
 JSON.stringify(historyData)
);

localStorage.setItem(
 "stock_settings",
 JSON.stringify(settings)
);

}


/* =====================================================
   التنقل
   ===================================================== */

function showView(id,button){

document.querySelectorAll(".view")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll(".nav button")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

renderAll();

}


/* =====================================================
   البحث الذكي
   ===================================================== */

function smartSearch(item,text){

text=text
.toLowerCase()
.trim();

if(!text)return true;

let name=item.name.toLowerCase();
let code=String(item.code).toLowerCase();

if(
 name.includes(text) ||
 code.includes(text)
)return true;


/*
   البحث بالقياس:

   إذا المستخدم كتب:
   243

   يطلع:
   243MM
   243 MM
   وغيرها
*/

let numbers=text.match(/\d+/g);

if(numbers){

for(let n of numbers){

if(name.includes(n))
return true;

}

}


/*
   البحث بالكلمات القريبة

   مثال:
   kindi

   يطلع:
   calcium-kindi
   vitamin-kindi
   ...
*/

let words=text.split(/\s+/);

return words.every(w=>
 name.includes(w) ||
 code.includes(w)
);

}


/* =====================================================
   إنشاء بطاقة
   ===================================================== */

function card(item){

let index=inventory.indexOf(item);

let state="";

if(item.qty===0){
 state="empty";
}else if(item.qty<=settings.limit){
 state="low";
}

let qty=Number(item.qty).toLocaleString(
 undefined,
 {maximumFractionDigits:4}
);

return `

<div class="card ${state}">

<div class="name">
${escapeHTML(item.name)}
</div>

<div class="code">
رمز المادة: ${escapeHTML(item.code || "غير محدد")}
</div>

<div class="qty">
${qty} ${item.unit}
</div>

<div class="info">
${item.qty===0
 ? "⚠️ المادة نفدت"
 : item.qty<=settings.limit
 ? "⚠️ المادة قريبة من النفاد"
 : "✓ المادة متوفرة"}
</div>

<div class="actions">

<button
 class="btn-add"
 onclick="openTransaction(${index},'add')">
➕ إضافة
</button>

<button
 class="btn-out"
 onclick="openTransaction(${index},'out')">
➖ سحب
</button>

<button
 class="btn-edit"
 onclick="openEdit(${index})">
✏️ تعديل
</button>

<button
 class="btn-delete"
 onclick="deleteMaterial(${index})">
🗑️ حذف
</button>

</div>

</div>

`;

}


/* =====================================================
   KG
   ===================================================== */

function renderKG(){

let q=document.getElementById("kgSearch").value;

let list=inventory.filter(i=>
 i.unit==="KG" &&
 smartSearch(i,q)
);

document.getElementById("kgList").innerHTML=

list.length
 ? list.map(card).join("")
 : `<div class="empty-msg">لا توجد مواد مطابقة</div>`;

}


/* =====================================================
   PCS
   ===================================================== */

function renderPCS(){

let q=document.getElementById("pcsSearch").value;

let list=inventory.filter(i=>
 i.unit==="PCS" &&
 smartSearch(i,q)
);

document.getElementById("pcsList").innerHTML=

list.length
 ? list.map(card).join("")
 : `<div class="empty-msg">لا توجد مواد مطابقة</div>`;

}


/* =====================================================
   الرئيسية
   ===================================================== */

function renderDashboard(){

let kg=inventory.filter(i=>i.unit==="KG").length;
let pcs=inventory.filter(i=>i.unit==="PCS").length;

let low=inventory.filter(i=>
 i.qty>0 && i.qty<=settings.limit
).length;

let zero=inventory.filter(i=>i.qty===0).length;

document.getElementById("total").innerText=inventory.length;
document.getElementById("kgCount").innerText=kg;
document.getElementById("pcsCount").innerText=pcs;
document.getElementById("lowCount").innerText=low;
document.getElementById("zeroCount").innerText=zero;

let critical=inventory.filter(i=>
 i.qty<=settings.limit
);

document.getElementById("critical").innerHTML=

critical.length
 ? critical.map(card).join("")
 : `<div class="empty-msg">لا توجد مواد حرجة</div>`;

}


/* =====================================================
   الإشعارات
   ===================================================== */

function renderNotifications(){

let critical=inventory.filter(i=>
 i.qty<=settings.limit
);

let box=document.getElementById("notifications");

if(!settings.notifications || !critical.length){

box.innerHTML="";
document.getElementById("notificationCount").innerText=0;

return;

}

let zero=critical.filter(i=>i.qty===0).length;

document.getElementById("notificationCount")
.innerText=critical.length;

let html="";

if(zero){

html+=`
<div class="notice">
🔴 تنبيه: يوجد ${zero} مادة نفدت من المخزن
</div>
`;

}

let low=critical.filter(i=>i.qty>0);

if(low.length){

html+=`
<div class="notice warning">
🟡 تنبيه: توجد ${low.length} مادة وصلت إلى حد التنبيه
</div>
`;

}

box.innerHTML=html;

}


/* =====================================================
   إضافة / سحب
   ===================================================== */

function openTransaction(index,type){

let item=inventory[index];

document.getElementById("transactionIndex")
.value=index;

document.getElementById("transactionQty")
.value="";

document.getElementById("transactionTitle")
.innerText=
type==="add"
? "إضافة كمية للمادة"
: "سحب كمية من المادة";

let btn=document.getElementById("transactionButton");

btn.className=
type==="add"
? "btn-add"
: "btn-out";

btn.innerText=
type==="add"
? "تأكيد الإضافة"
: "تأكيد السحب";

btn.onclick=()=>executeTransaction(type);

document.getElementById("transactionModal")
.classList.add("open");

}


function executeTransaction(type){

let index=Number(
document.getElementById("transactionIndex").value
);

let amount=Number(
document.getElementById("transactionQty").value
);

if(!amount || amount<=0){

alert("أدخل كمية صحيحة");

return;

}

let item=inventory[index];

let before=item.qty;

if(type==="out"){

if(amount>item.qty){

alert(
"❌ لا يمكن السحب.\nالكمية الموجودة: "
+item.qty+" "+item.unit
);

return;

}

item.qty-=amount;

}else{

item.qty+=amount;

}

let after=item.qty;


/* تسجيل الحركة */

historyData.unshift({

date:new Date().toLocaleString("ar-IQ"),

code:item.code,

name:item.name,

unit:item.unit,

type:type,

amount:amount,

before:before,

after:after

});


save();

closeModal();

renderAll();

}


function closeModal(){

document.getElementById("transactionModal")
.classList.remove("open");

}


/* =====================================================
   إضافة مادة جديدة
   ===================================================== */

function addNewMaterial(){

let code=document.getElementById("newCode").value.trim();

let name=document.getElementById("newName").value.trim();

let qty=Number(
document.getElementById("newQty").value
);

let unit=document.getElementById("newUnit").value;

if(!name){

alert("أدخل اسم المادة");

return;

}

if(!qty || qty<0){

alert("أدخل كمية صحيحة");

return;

}


/*
   لا ندمج مادة مختلفة.

   فقط إذا الرمز + الاسم + الوحدة
   متطابقة تماماً.
*/

let existing=inventory.find(i=>
 i.code===code &&
 i.name===name &&
 i.unit===unit
);

if(existing){

existing.qty+=qty;

}else{

inventory.push({
 code,
 name,
 qty,
 unit
});

}

save();

document.getElementById("newCode").value="";
document.getElementById("newName").value="";
document.getElementById("newQty").value="";

alert("تمت إضافة المادة");

renderAll();

}


/* =====================================================
   تعديل
   ===================================================== */

function openEdit(index){

let item=inventory[index];

document.getElementById("editIndex").value=index;
document.getElementById("editCode").value=item.code;
document.getElementById("editName").value=item.name;
document.getElementById("editQty").value=item.qty;
document.getElementById("editUnit").value=item.unit;

document.getElementById("editModal")
.classList.add("open");

}


function saveEdit(){

let index=Number(
document.getElementById("editIndex").value
);

inventory[index].code=
document.getElementById("editCode").value.trim();

inventory[index].name=
document.getElementById("editName").value.trim();

inventory[index].qty=
Number(document.getElementById("editQty").value);

inventory[index].unit=
document.getElementById("editUnit").value;

save();

closeEdit();

renderAll();

}


function closeEdit(){

document.getElementById("editModal")
.classList.remove("open");

}


/* =====================================================
   حذف المادة
   ===================================================== */

function deleteMaterial(index){

let item=inventory[index];

let answer=confirm(
"هل تريد حذف المادة نهائياً؟\n\n"+
item.name+
"\nالرصيد: "+
item.qty+" "+
item.unit
);

if(!answer)return;

inventory.splice(index,1);

save();

renderAll();

alert("تم حذف المادة بنجاح");

}


/* =====================================================
   سجل الحركات
   ===================================================== */

function renderHistory(){

let box=document.getElementById("historyList");

if(!historyData.length){

box.innerHTML=
`<div class="empty-msg">لا توجد حركات بعد</div>`;

return;

}

box.innerHTML=historyData.map(h=>`

<div class="history">

<b>${escapeHTML(h.name)}</b>

<br>

رمز:
${escapeHTML(h.code || "-")}

<br>

${h.type==="add" ? "➕ إضافة" : "➖ سحب"}:
${Number(h.amount).toLocaleString()} ${h.unit}

<br>

الرصيد:
${Number(h.before).toLocaleString()}
→
${Number(h.after).toLocaleString()}

<br>

<span style="color:var(--muted)">
${h.date}
</span>

</div>

`).join("");

}

document.getElementById("limitInput").value
);

}

settings.limit=limit;

document.getElementById("notificationSetting").value==="on";

}

/* =====================================================
   تصدير CSV
   ===================================================== */

function exportCSV(){

let csv="\uFEFF";

csv+="رمز المادة,اسم المادة,الكمية,الوحدة\n";

inventory.forEach(i=>{

csv+=
`"${escapeCSV(i.code)}",`+
`"${escapeCSV(i.name)}",`+
`${i.qty},`+
`"${i.unit}"\n`;

});

let blob=new Blob(
[csv],
{type:"text/csv;charset=utf-8;"}
);

let url=URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;

a.download="stock_inventory.csv";

a.click();

URL.revokeObjectURL(url);

}


/* =====================================================
   حماية النص
   ===================================================== */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeCSV(text){

return String(text||"")
.replace(/"/g,'""');

}

renderDashboard();
